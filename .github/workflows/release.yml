name: Release

# This workflow never publishes anything. You make the release yourself on GitHub, and this
# workflow helps in two ways:
#
#   1. On every push to the branch below (and when run manually) it builds the data pack zip and
#      writes the changelog: every commit since your latest release. Open the run's summary page
#      to copy the changelog text, or download the "release-notes" / zip artifacts.
#   2. When you publish a release on GitHub, it builds the zip for that tag and attaches it to
#      your release automatically.
#
# TODO: when automated_testing is merged, change the push branch below to main.
on:
  push:
    branches: [automated_testing]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional text to put at the top of the changelog"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build the data pack zip
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the zip to a release you publish
    steps:
      - uses: actions/checkout@v7

      - name: Build the zip
        id: build
        run: >
          python3 .github/scripts/build_release_zip.py
          --version "${{ github.event_name == 'release' && github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error

      # Only when you publish a release on GitHub: attach the zip to it.
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.zip_path }}" --clobber

  changelog:
    name: Write the changelog
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write the changelog
        env:
          NOTES: ${{ inputs.notes }}
        run: >
          python3 .github/scripts/build_release_notes.py
          --tag "${{ github.ref_name }}" --sha "$GITHUB_SHA"
          --notes "$NOTES" --repo "$GITHUB_REPOSITORY" --out notes.md
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
